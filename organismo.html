<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ORUM · Organismo</title>
<style>
  :root{
    --bg:#08060a;
    --bg-card:#100c14;
    --amber:#FFB020;
    --amber-dim:#FFB02055;
    --ok:#3ddc84;
    --warn:#ffcf4d;
    --dead:#ff5c5c;
    --ink:#f2ede4;
    --ink-dim:#9b9490;
    --line:#2a2430;
  }
  @media (prefers-color-scheme: light){ /* dark is the only mode, by design */ }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);}
  body{
    font-family:'Space Grotesk',system-ui,-apple-system,sans-serif;
    min-height:100dvh;
    padding-bottom:88px;
    overflow-x:hidden;
  }
  @font-face{
    font-family:'Space Grotesk';
    src:local('Space Grotesk');
  }
  header.hero{
    padding:28px 20px 14px;
    text-align:center;
  }
  header.hero .mark{
    font-size:13px;
    letter-spacing:.22em;
    color:var(--ink-dim);
    text-transform:uppercase;
  }
  header.hero h1{
    font-size:26px;
    margin:6px 0 2px;
    font-weight:600;
    letter-spacing:-.01em;
  }
  header.hero .sub{
    font-size:13px;
    color:var(--ink-dim);
  }

  /* ---------- circuito ---------- */
  .circuito-wrap{
    padding:8px 12px 4px;
  }
  svg#circuito{
    width:100%;
    height:auto;
    display:block;
    overflow:visible;
  }
  .no{
    cursor:pointer;
  }
  .no rect{
    fill:var(--bg-card);
    stroke:var(--line);
    stroke-width:1.4;
    rx:16;
    transition:stroke .25s, filter .25s;
  }
  .no.aberto rect{
    stroke:var(--amber);
    filter:drop-shadow(0 0 10px var(--amber-dim));
  }
  .no text.rotulo{
    fill:var(--ink);
    font-size:13.5px;
    font-weight:600;
    text-anchor:middle;
    dominant-baseline:middle;
  }
  .no text.pergunta{
    fill:var(--ink-dim);
    font-size:9px;
    text-anchor:middle;
    dominant-baseline:middle;
  }
  .estado-dot{
    r:4.5;
  }
  .estado-ok{ fill:var(--ok); }
  .estado-warn{ fill:var(--warn); }
  .estado-dead{ fill:var(--dead); }
  .estado-lendo{ fill:var(--ink-dim); }
  .estado-falha{ fill:var(--ink-dim); stroke:var(--dead); stroke-width:1.5; }
  path.ligacao{
    fill:none;
    stroke:var(--line);
    stroke-width:1.6;
  }
  path.ligacao.viva{
    stroke:var(--amber-dim);
  }
  .pulso-pulse{
    animation: respirar 3.6s ease-in-out infinite;
    transform-origin:center;
  }
  @keyframes respirar{
    0%,100%{ opacity:.55; }
    50%{ opacity:1; }
  }
  @media (prefers-reduced-motion: reduce){
    .pulso-pulse{ animation:none; opacity:1; }
  }

  /* ---------- cartao expandido ---------- */
  #painel{
    margin:6px 16px 0;
  }
  .cartao{
    display:none;
    background:var(--bg-card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:18px 18px 14px;
    animation:entra .22s ease-out;
  }
  .cartao.mostra{ display:block; }
  @keyframes entra{
    from{ opacity:0; transform:translateY(6px); }
    to{ opacity:1; transform:translateY(0); }
  }
  .cartao h2{
    margin:0 0 2px;
    font-size:17px;
    font-weight:600;
  }
  .cartao .pergunta-h{
    margin:0 0 14px;
    font-size:12px;
    color:var(--ink-dim);
    font-style:italic;
  }
  .cartao .fonte-card{
    margin:-8px 0 14px;
    font-size:10.5px;
    color:#6a655f;
    font-family:'SF Mono','Courier New',monospace;
  }
  .nivel{
    display:inline-block;
    padding:1px 6px;
    border-radius:6px;
    font-size:9px;
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-right:6px;
    font-family:-apple-system,sans-serif;
  }
  .nivel-vivo{ background:#123d2a; color:var(--ok); }
  .nivel-derivado{ background:#2a220f; color:var(--warn); }
  .nivel-estatico{ background:#241f2a; color:var(--ink-dim); }
  .metrica{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    padding:10px 0;
    border-top:1px solid var(--line);
  }
  .metrica:first-of-type{ border-top:none; }
  .metrica .rot{ font-size:13px; color:var(--ink-dim); }
  .metrica .val{
    font-size:16px;
    font-weight:600;
    font-variant-numeric:tabular-nums;
    cursor:pointer;
    border-bottom:1px dashed var(--line);
  }
  .metrica .val:active{ opacity:.6; }

  .proveniencia{
    display:none;
    margin:2px 0 8px;
    padding:10px 12px;
    background:#000;
    border:1px solid var(--line);
    border-radius:10px;
    font-size:11px;
    color:var(--ink-dim);
    font-family:'SF Mono','Courier New',monospace;
    line-height:1.6;
    word-break:break-all;
  }
  .proveniencia.mostra{ display:block; }
  .proveniencia b{ color:var(--amber); font-weight:600; }

  .lista{
    list-style:none;
    margin:0;
    padding:0;
  }
  .lista li{
    padding:9px 0;
    border-top:1px solid var(--line);
    font-size:13px;
    color:var(--ink-dim);
  }
  .lista li:first-child{ border-top:none; }
  .lista li .quando-li{
    display:block;
    font-size:10.5px;
    color:#6a655f;
    margin-bottom:2px;
    text-transform:uppercase;
    letter-spacing:.05em;
  }
  .lista a.rasto{
    display:block;
    color:inherit;
    text-decoration:none;
    border-radius:10px;
    padding:3px 6px;
    margin:-3px -6px;
  }
  .lista a.rasto:focus-visible,.lista a.rasto:active{
    outline:1px solid var(--amber);
    color:var(--ink);
  }
  .lista .abrir-origem{display:block;margin-top:5px;color:var(--amber);font-size:10.5px;letter-spacing:.04em;}

  .carregando{
    padding:20px 0;
    text-align:center;
    color:var(--ink-dim);
    font-size:12px;
  }

  /* ---------- ver por dentro ---------- */
  body.dentro .cartao{ border-radius:2px; }
  body.dentro .no rect{ rx:2; }
  body.dentro .proveniencia{ display:block !important; }
  body.dentro .metrica .val{ border-bottom-style:solid; }

  /* ---------- nav ---------- */
  nav.inferior{
    position:fixed;
    left:12px; right:12px; bottom:14px;
    background:rgba(16,12,20,.92);
    backdrop-filter:blur(14px);
    border:1px solid var(--line);
    border-radius:20px;
    display:flex;
    padding:6px;
  }
  nav.inferior button{
    flex:1;
    background:none;
    border:none;
    color:var(--ink-dim);
    font-family:inherit;
    font-size:10.5px;
    padding:9px 2px 7px;
    border-radius:14px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:3px;
  }
  nav.inferior button .ic{ font-size:16px; }
  nav.inferior button.activo{
    color:var(--amber);
    background:#1a1420;
  }

  footer.assinatura{
    text-align:center;
    padding:22px 20px 8px;
    font-size:10.5px;
    letter-spacing:.14em;
    color:#5a5550;
    text-transform:uppercase;
  }
  .toggle-dentro{
    display:block;
    margin:0 auto 6px;
    background:none;
    border:1px solid var(--line);
    color:var(--ink-dim);
    font-size:10.5px;
    padding:7px 14px;
    border-radius:20px;
    font-family:inherit;
  }
  body.dentro .toggle-dentro{ color:var(--amber); border-color:var(--amber-dim); }
</style>
</head>
<body>

<header class="hero">
  <div class="mark">ORUM</div>
  <h1>Organismo</h1>
  <div class="sub">como estou, agora</div>
</header>

<div class="circuito-wrap">
  <svg id="circuito" viewBox="0 0 320 610" xmlns="http://www.w3.org/2000/svg">
    <!-- ligações (percurso de leitura) -->
    <path class="ligacao viva" d="M160,50 L160,100" />
    <path class="ligacao viva" d="M160,140 L160,178" />
    <path class="ligacao viva" d="M160,178 L95,178 L95,216" />
    <path class="ligacao viva" d="M160,178 L225,178 L225,216" />
    <path class="ligacao viva" d="M95,256 L95,300 L160,330" />
    <path class="ligacao viva" d="M225,256 L225,300 L160,330" />
    <path class="ligacao" d="M95,236 L225,236" />
    <path class="ligacao viva" d="M160,360 L160,400" />
    <path class="ligacao viva" d="M160,440 L160,470" />
    <path class="ligacao viva" d="M160,510 L160,540" />

    <!-- PULSO -->
    <g class="no" data-orgao="pulso" transform="translate(160,30)">
      <circle class="pulso-pulse" r="30" fill="none" stroke="var(--amber-dim)" stroke-width="1"/>
      <rect x="-52" y="-20" width="104" height="40"/>
      <circle class="estado-dot estado-lendo" cx="-38" cy="-8" data-dot="pulso"/>

      <text class="pergunta" y="12">como estou?</text>
    </g>

    <!-- FLUXO -->
    <g class="no" data-orgao="fluxo" transform="translate(160,120)">
      <rect x="-58" y="-20" width="116" height="40"/>
      <circle class="estado-dot estado-lendo" cx="-44" cy="-8" data-dot="fluxo"/>
      <text class="rotulo" y="-2">Fluxo</text>
      <text class="pergunta" y="12">o que acontece?</text>
    </g>

    <!-- PONTE -->
    <g class="no" data-orgao="ponte" transform="translate(160,178)">
      <rect x="-44" y="-16" width="88" height="32" rx="10"/>
      <text class="rotulo" y="0" style="font-size:11.5px">Ponte</text>
      <text class="pergunta" y="11" style="font-size:8px">o que mudou?</text>
    </g>

    <!-- MEMÓRIA -->
    <g class="no" data-orgao="memoria" transform="translate(95,236)">
      <rect x="-52" y="-20" width="104" height="40"/>
      <circle class="estado-dot estado-lendo" cx="-38" cy="-8" data-dot="memoria"/>

    <g class="no" data-orgao="aprendizagem" transform="translate(225,236)">
      <rect x="-58" y="-20" width="116" height="40"/>
      <circle class="estado-dot estado-lendo" cx="-44" cy="-8" data-dot="aprendizagem"/>
      <text class="rotulo" y="-2" style="font-size:12px">Aprendizagem</text>

    <!-- VOZ -->
    <g class="no" data-orgao="voz" transform="translate(160,340)">
      <rect x="-46" y="-20" width="92" height="40"/>
      <circle class="estado-dot estado-lendo" cx="-32" cy="-8" data-dot="voz"/>
      <text class="rotulo" y="-2">Voz</text>
      <text class="pergunta" y="12">o que foi dito?</text>
    </g>

    <!-- AUDITORIA -->
    <g class="no" data-orgao="auditoria" transform="translate(160,420)">
      <rect x="-58" y="-20" width="116" height="40"/>
      <circle class="estado-dot estado-lendo" cx="-44" cy="-8" data-dot="auditoria"/>
      <text class="rotulo" y="-2" style="font-size:12.5px">Auditoria</text>
      <text class="pergunta" y="12" style="font-size:8px">está tudo verificável?</text>
    </g>

    <!-- LICENÇAS -->
    <g class="no" data-orgao="licencas" transform="translate(160,490)">
      <rect x="-54" y="-20" width="108" height="40"/>
      <circle class="estado-dot estado-lendo" cx="-40" cy="-8" data-dot="licencas"/>
      <text class="rotulo" y="-2" style="font-size:12.5px">Licenças</text>
      <text class="pergunta" y="12" style="font-size:8px">o que foi licenciado?</text>
    </g>

    <!-- ECOSSISTEMA -->
    <g class="no" data-orgao="ecossistema" transform="translate(160,560)">
      <rect x="-58" y="-20" width="116" height="40"/>
      <circle class="estado-dot estado-lendo" cx="-44" cy="-8" data-dot="ecossistema"/>
      <text class="rotulo" y="-2" style="font-size:12px">Ecossistema</text>
      <text class="pergunta" y="12" style="font-size:8px">com quem me relaciono?</text>
    </g>
  </svg>
</div>

<div id="painel"></div>

<button class="toggle-dentro" id="btnDentro" style="margin-top:10px;">ver por dentro</button>

<footer class="assinatura">Observável · Verificável · Reproduzível</footer>

<nav class="inferior">
  <button class="activo"><span class="ic">◎</span>Organismo</button>
  <a href="/servicos.html" style="flex:1;text-decoration:none;background:none;border:none;color:var(--ink-dim);font-family:inherit;font-size:10.5px;padding:9px 2px 7px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px;"><span class="ic">▤</span>Serviços</a>
  <a href="/arquivo.html" style="flex:1;text-decoration:none;background:none;border:none;color:var(--ink-dim);font-family:inherit;font-size:10.5px;padding:9px 2px 7px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px;"><span class="ic">▥</span>Arquivo</a>
  <a href="/laboratorio.html" style="flex:1;text-decoration:none;background:none;border:none;color:var(--ink-dim);font-family:inherit;font-size:10.5px;padding:9px 2px 7px;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px;"><span class="ic">⚙</span>Laboratório</a>
</nav>

<script>
const SB_URL = 'https://ywabnlhkmhbyewqhbsjm.supabase.co/rest/v1/';
const SB_KEY = 'sb_publishable_XtI6QAmSYt5KHIazVCgoQw_qVYZ8AVb';

async function sb(path){
  const r = await fetch(SB_URL + path, {
    headers:{ apikey: SB_KEY, Authorization: 'Bearer ' + SB_KEY }
  });
  if(!r.ok) throw new Error('falha ' + r.status + ' em ' + path);
  return r.json();
}

function fmtHora(iso){
  if(!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleString('pt-PT', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit', timeZone:'UTC' }) + ' UTC';
}

function escapar(valor){
  return String(valor ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function metrica(rot, val, prov){
  const id = 'p_' + Math.random().toString(36).slice(2);
  return `<div class="metrica">
      <span class="rot">${rot}</span>
      <span class="val" onclick="document.getElementById('${id}').classList.toggle('mostra')">${val}</span>
    </div>
    <div class="proveniencia" id="${id}">${prov}</div>`;
}

function provOrgao(vista, campo, quando, extra){
  return `<b>vista</b> ${vista}\n<b>campo</b> ${campo}\n<b>última leitura</b> ${fmtHora(quando)}${extra ? '\n' + extra : ''}`;
}

const painel = document.getElementById('painel');
const nos = document.querySelectorAll('.no');
let aberto = null;

const carregadores = {
  pulso: carregarPulso,
  fluxo: carregarFluxo,
  ponte: carregarPonte,
  memoria: carregarMemoria,
  aprendizagem: carregarAprendizagem,
  voz: carregarVoz,
  auditoria: carregarAuditoria,
  licencas: carregarLicencas,
  ecossistema: carregarEcossistema,
};

nos.forEach(no => {
  no.addEventListener('click', () => {
    const orgao = no.dataset.orgao;
    nos.forEach(n => n.classList.remove('aberto'));
    if(aberto === orgao){
      aberto = null;
      painel.innerHTML = '';
      return;
    }
    no.classList.add('aberto');
    aberto = orgao;
    painel.innerHTML = '<div class="cartao mostra"><div class="carregando">a ler ' + orgao + '…</div></div>';
    carregadores[orgao]().catch(e => {
      painel.innerHTML = `<div class="cartao mostra"><h2>${orgao}</h2><div class="carregando">não foi possível ler agora — ${e.message}</div></div>`;
    });
  });
});

async function carregarPulso(){
  const [f] = await sb('ora_frescura_publica?select=*&order=medido_em.desc&limit=1');
  const cor = f.veredicto === 'VIVO' ? 'estado-ok' : (f.veredicto === 'ATRASADO' ? 'estado-warn' : 'estado-dead');
  document.querySelector('[data-dot="pulso"]').setAttribute('class', 'estado-dot ' + cor);
  painel.innerHTML = `<div class="cartao mostra">
    <h2>Pulso</h2>
    <p class="pergunta-h">como estou?</p>
    <div class="fonte-card"><span class="nivel nivel-vivo">ao vivo</span>fonte ora_frescura_publica · lido ${fmtHora(f.medido_em)}</div>
    ${metrica('veredicto', f.veredicto, provOrgao('ora_frescura_publica','veredicto',f.medido_em))}
    ${metrica('mortos', f.mortos, provOrgao('ora_frescura_publica','mortos',f.medido_em))}
    ${metrica('atrasados', f.atrasados, provOrgao('ora_frescura_publica','atrasados',f.medido_em))}
    ${metrica('sinais medidos', Object.keys(f.sinais||{}).length, provOrgao('ora_frescura_publica','sinais',f.medido_em))}
  </div>`;
}

async function carregarFluxo(){
  const [s] = await sb('ora_aprendizagem_ultimo_snapshot_publica?select=*');
  const dot = document.querySelector('[data-dot="fluxo"]');
  dot.setAttribute('class', 'estado-dot ' + (s.compradores_externos > 0 ? 'estado-ok' : 'estado-warn'));
  const prov = (campo) => provOrgao('ora_aprendizagem_ultimo_snapshot_publica', campo, s.criado_em, `<b>hash</b> ${s.hash_reprodutivel ? s.hash_reprodutivel.slice(0,16)+'…' : '—'}`);
  painel.innerHTML = `<div class="cartao mostra">
    <h2>Fluxo</h2>
    <p class="pergunta-h">o que está a acontecer?</p>
    <div class="fonte-card"><span class="nivel nivel-derivado">derivado de snapshot</span>fonte ora_aprendizagem_ultimo_snapshot_publica · lido ${fmtHora(s.criado_em)} · hash ${s.hash_reprodutivel ? s.hash_reprodutivel.slice(0,12)+'…' : '—'}</div>
    ${metrica('acessos externos', s.acessos_externos, prov('acessos_externos'))}
    ${metrica('agentes distintos', s.agentes_externos_distintos, prov('agentes_externos_distintos'))}
    ${metrica('pagamentos', s.pagamentos, prov('pagamentos'))}
    ${metrica('compradores externos', s.compradores_externos, prov('compradores_externos'))}
    ${metrica('conversão externa %', s.conversao_externa, prov('conversao_externa'))}
  </div>`;
}

async function carregarPonte(){
  const [s] = await sb('ora_aprendizagem_ultimo_snapshot_publica?select=*');
  const d = s.delta || {};
  document.querySelector('.no[data-orgao="ponte"] rect').setAttribute('fill', 'var(--bg-card)');
  const linhasDelta = Object.entries(d).filter(([k]) => k !== 'desde' && k !== 'mudanca_material')
    .map(([k,v]) => metrica(k, v, provOrgao('ora_aprendizagem_ultimo_snapshot_publica', 'delta.'+k, s.criado_em))).join('');
  painel.innerHTML = `<div class="cartao mostra">
    <h2>Ponte</h2>
    <p class="pergunta-h">o que mudou desde a última observação?</p>
    <div class="fonte-card"><span class="nivel nivel-derivado">derivado de snapshot</span>fonte ora_aprendizagem_ultimo_snapshot_publica.delta · lido ${fmtHora(s.criado_em)} · hash ${s.hash_reprodutivel ? s.hash_reprodutivel.slice(0,12)+'…' : '—'}</div>
    ${metrica('desde', fmtHora(d.desde), provOrgao('ora_aprendizagem_ultimo_snapshot_publica','delta.desde',s.criado_em))}
    ${linhasDelta}
    <div class="proveniencia mostra" style="margin-top:10px;">
      <b>hash do snapshot</b> ${s.hash_reprodutivel || '—'}<br>
      <b>mudança material</b> ${d.mudanca_material || '—'}
    </div>
  </div>`;
}

async function carregarMemoria(){
  const [digital, nFisica] = await Promise.all([
    sb('ora_coleccao_publica?select=token_id&limit=1000'),
    sb('ora_coleccao_fisica_publica?select=id&limit=1000'),
  ]);
  document.querySelector('[data-dot="memoria"]').setAttribute('class', 'estado-dot estado-ok');
  painel.innerHTML = `<div class="cartao mostra">
    <h2>Memória</h2>
    <p class="pergunta-h">o que permanece?</p>
    <div class="fonte-card"><span class="nivel nivel-vivo">ao vivo</span>fonte ora_coleccao_publica + ora_coleccao_fisica_publica · lido ${fmtHora(new Date().toISOString())}</div>
    ${metrica('obras digitais históricas', digital.length, provOrgao('ora_coleccao_publica','token_id (contagem)', new Date().toISOString()))}
    ${metrica('obras físicas registadas', nFisica.length, provOrgao('ora_coleccao_fisica_publica','id (contagem)', new Date().toISOString()))}
  </div>`;
}

async function carregarAprendizagem(){
  const muds = await sb('ora_mudancas?select=*&order=quando.desc&limit=8');
  document.querySelector('[data-dot="aprendizagem"]').setAttribute('class', 'estado-dot estado-ok');
  const linhas = muds.map(m => `<li>
      <span class="quando-li">${fmtHora(m.quando)} · v${m.versao || '—'}</span>
      ${m.o_que}
    </li>`).join('');
  painel.innerHTML = `<div class="cartao mostra">
    <h2>Aprendizagem</h2>

function estadoLicenca(l){
  if (l.revogada_em) return 'revogada';
  if (l.valida_ate && new Date(l.valida_ate) < new Date()) return 'expirada';
  return 'activa';
}

function linhaLicenca(l, origemPorCarteira){
  const est = estadoLicenca(l);
  const tx = l.tx_hash ? l.tx_hash.slice(0,10) + '…' + l.tx_hash.slice(-6) : '—';
  const origem = origemPorCarteira ? (origemPorCarteira[(l.licenciado||'').toLowerCase()] || 'desconhecido') : null;
  const origemTag = origem ? ` · <span style="color:${origem==='externo_confirmado' ? 'var(--ok, #3ddc84)' : 'var(--ink-dim)'};">${origem}</span>` : '';
  return `<li>
      <span class="quando-li">${fmtHora(l.emitida_em)} · ${l.tipo_licenca} · ${est}${origemTag}</span>
      ${l.obra_titulo} — ${l.valor_usdc} USDC — <span style="font-family:'SF Mono','Courier New',monospace;">${tx}</span>
    </li>`;
}

async function carregarLicencas(){
  const [fisicas, nft, classificacao] = await Promise.all([
    sb('ora_licencas_fisicas?select=obra_titulo,tipo_licenca,emitida_em,valida_ate,revogada_em,valor_usdc,tx_hash,licenciado&order=emitida_em.desc'),
    sb('licencas_0001?select=obra_titulo,tipo_licenca,emitida_em,valida_ate,revogada_em,valor_usdc,tx_hash&order=emitida_em.desc'),
    sb('ora_carteiras_classificacao?select=endereco,classificacao'),
  ]);
  document.querySelector('[data-dot="licencas"]').setAttribute('class', 'estado-dot estado-ok');

  const origemPorCarteira = {};
  (classificacao||[]).forEach(c => { origemPorCarteira[(c.endereco||'').toLowerCase()] = c.classificacao; });

  const externasConfirmadas = fisicas.filter(l => origemPorCarteira[(l.licenciado||'').toLowerCase()] === 'externo_confirmado').length;

  const linhasFisicas = fisicas.map(l => linhaLicenca(l, origemPorCarteira)).join('');
  const linhasNft = nft.map(l => linhaLicenca(l, null)).join('');

  const notaFisicas = fisicas.length
    ? `${fisicas.length} emitida${fisicas.length===1?'':'s'}, ${externasConfirmadas} de comprador externo confirmado. O mecanismo (pagamento real → verificação on-chain → licença → URL assinada → acesso) já foi exercitado com uma transacção real — mas ainda por uma carteira classificada como interna. Prova funcionamento; não prova adesão externa.`
    : 'Catálogo único desde 04/08/2026 (consulta/editorial/treino, 107 obras físicas). 0 emitidas não é falha, é ausência real de teste.';

  painel.innerHTML = `<div class="cartao mostra">
    <h2>Licenças</h2>
    <p class="pergunta-h">o que foi licenciado?</p>
    <div class="fonte-card"><span class="nivel nivel-vivo">ao vivo</span>fonte ora_licencas_fisicas + licencas_0001 + ora_carteiras_classificacao (fontes distintas, nunca somadas) · lido ${fmtHora(new Date().toISOString())}</div>

    <h3 style="margin:14px 0 4px;font-size:12.5px;">Catálogo actual — Colecção física</h3>
    ${metrica('emitidas', fisicas.length, provOrgao('ora_licencas_fisicas','id (contagem)', new Date().toISOString()))}
    ${metrica('compradores externos confirmados', externasConfirmadas, provOrgao('ora_carteiras_classificacao','classificacao=externo_confirmado, cruzado por carteira licenciada', new Date().toISOString()))}
    <p style="font-size:11px;color:var(--ink-dim);margin:4px 0 8px;">${notaFisicas}</p>
    <ul class="lista" style="margin-top:4px;">${fisicas.length ? linhasFisicas : '<li>nenhuma licença física emitida ainda</li>'}</ul>

    <h3 style="margin:16px 0 4px;font-size:12.5px;">Arquivo histórico NFT — licenças de teste</h3>
    ${metrica('emitidas (histórico)', nft.length, provOrgao('licencas_0001','id (contagem)', new Date().toISOString()))}
    <p style="font-size:11px;color:var(--ink-dim);margin:4px 0 8px;">Congelado em 04/08/2026: os 65 NFTs deixaram de ser licenciáveis. Estas ${nft.length} licenças foram todas emitidas pelo próprio Jorge, a testar — nenhum comprador externo real. Preservadas como histórico, não apagadas.</p>
    <ul class="lista" style="margin-top:4px;">${nft.length ? linhasNft : '<li>nenhuma licença histórica</li>'}</ul>

    <div class="proveniencia mostra" style="margin-top:10px;">${provOrgao('ora_licencas_fisicas + licencas_0001 + ora_carteiras_classificacao','obra_titulo / tipo_licenca / tx_hash / licenciado', new Date().toISOString())}</div>
  </div>`;
}
